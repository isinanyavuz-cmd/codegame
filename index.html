<body>
<div id="stage"></div>

<!-- Rota ekranı -->
<section id="map" class="screen" hidden>
  <header class="maphead">
    <div class="logo"><small>UZAY KODLAMA MACERASI</small><b>KOD PİLOTU</b></div>
    <div class="mapstats">
      <div class="rank glass"><small>RÜTBE</small><b id="rank">Çaylak Pilot</b></div>
      <div class="total glass"><svg viewBox="0 0 32 32"><use href="#i-star"/></svg><b id="totalStars">0</b><span id="maxStars">/ 72</span></div>
      <button class="iconbtn" id="voiceBtn" aria-label="Sesli okuma"><svg viewBox="0 0 32 32"><use href="#i-speak"/></svg></button>
      <button class="iconbtn" id="musicBtn" aria-label="Müzik"><svg viewBox="0 0 32 32"><use href="#i-music"/></svg></button>
      <button class="iconbtn" id="soundBtn" aria-label="Ses efektleri"><svg viewBox="0 0 32 32"><use href="#i-sound"/></svg></button>
    </div>
  </header>
  <div class="route" id="route"></div>
  <nav class="dock glass" id="dock" aria-label="Köprü"></nav>
</section>

<!-- Görev ekranı -->
<section id="game" class="screen" hidden>
  <div class="top">
    <button class="back" id="backBtn" aria-label="Rotaya dön"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6L10 16l10 10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Rota</span></button>
    <div class="ttl"><small id="sectorNo">SEKTÖR 1</small><b id="sectorName">Kalkış</b></div>
  </div>
  <button class="iconbtn gsnd" id="gameSoundBtn" aria-label="Sesi kapat/aç"><svg viewBox="0 0 32 32"><use href="#i-sound"/></svg></button>
  <button class="iconbtn gcam" id="camBtn" aria-label="Pilot kamerası"><svg viewBox="0 0 32 32"><use href="#i-cam"/></svg></button>
  <div class="hud"><div class="gems glass" id="gems" hidden></div><div class="record glass" id="record" hidden></div></div>
  <div class="track" id="track"></div>
  <div class="telemetry glass" id="telemetry" aria-live="polite" hidden></div>

  <aside class="code glass" id="panel">
    <div class="brief">
      <div class="row"><span class="lab" id="missionNo">GÖREV 1 / 8</span><span class="chip" id="conceptChip">Sıralama</span><button class="mini speak" id="speakBtn" aria-label="Görevi sesli oku"><svg viewBox="0 0 32 32"><use href="#i-speak"/></svg></button></div>
      <h2 id="missionTitle" tabindex="-1"></h2>
      <p id="missionText"></p>
      <div class="wavebar" id="waveBar" hidden><span class="waves" id="waves"></span><span class="note" id="waveNote"></span></div>
    </div>
    <div class="tabrow">
      <div class="tabs" id="tabs"><button class="on" data-tab="blocks">Blok</button><button data-tab="python">Python</button></div>
      <div class="meta">
        <button class="mini" id="undoBtn" aria-label="Geri al" disabled><svg viewBox="0 0 32 32"><use href="#i-undo"/></svg></button>
        <span class="counter" id="counter"></span>
      </div>
    </div>
    <div class="ws" id="ws"></div>
    <pre class="py" id="py" hidden></pre>
    <div class="quizbar" id="quizBar" hidden><p id="quizAsk"></p><div class="qbtns" id="quizBtns"></div></div>
    <div class="pal"><div class="pl">BU GÖREVİN BLOKLARI</div><div class="palrow" id="pal"></div></div>
    <button class="big go next" id="nextBtn" hidden></button>
    <div class="ctrl">
      <button class="big" id="runBtn"></button>
      <button class="sq" id="stepBtn"><svg viewBox="0 0 32 32"><path d="M7 6l13 10L7 26z" fill="currentColor"/><rect x="21" y="6" width="5" height="20" rx="2" fill="currentColor"/></svg>adım</button>
      <button class="sq" id="resetBtn" aria-label="Uçuşu başa al"><svg viewBox="0 0 32 32" aria-hidden="true"><use href="#i-restart"/></svg>baştan</button>
      <button class="sq" id="speedBtn"><b id="speedLab">1×</b>hız</button>
    </div>
  </aside>

  <label class="scrub glass" id="scrub" hidden><span>geri sar</span><input type="range" id="scrubRange" min="0" max="1" step="1" value="1" aria-label="Uçuşu geri sar"><b id="scrubLab"></b></label>
  <div id="calls"></div>
  <div id="picks"></div>
  <div id="toast" class="toast glass" hidden></div>
</section>

<div id="overlay" class="overlay" hidden></div>
<div id="pop" class="pop glass" hidden></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
